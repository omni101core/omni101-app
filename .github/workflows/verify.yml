name: Verify OMNI101
on:
  push:
    branches: [rebuild-commercial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Deploy verified staging
        run: npx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 179e35741ac5e7a9e2c3be26f5a482b8
      - uses: actions/upload-artifact@v4
        with:
          name: omni101-verified-build
          path: |
            apps/web/build
            .wrangler
            playwright-report
            test-results
          retention-days: 7
        if: always()
