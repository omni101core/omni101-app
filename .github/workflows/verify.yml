name: Verify OMNI101
on:
  push:
    branches: [verify-commercial, rebuild-commercial, release-commercial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify context references
        run: |
          for domain in growth knowledge frontend security release; do node scripts/project-context.mjs "$domain" > /dev/null; done
      - name: Verify requirement coverage freshness
        run: node scripts/reconcile-requirements.mjs --check
      - run: npm run typecheck
      - run: npm test
      - name: Build isolated test environment
        run: npm run build
        env:
          CLOUDFLARE_ENV: test
      - name: Prepare isolated test database
        run: |
          npx wrangler d1 migrations apply DB --local --config wrangler.jsonc --env test
          npx wrangler d1 execute DB --local --config wrangler.jsonc --env test --file ../../tests/owner-fixture.sql
        working-directory: apps/web
      - name: Install browser runtime
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps --only-shell chromium
      - name: Run browser verification
        run: |
          if [ "$GITHUB_REF_NAME" = "verify-commercial" ] && [ -s tests/ci-browser-grep.txt ]; then
            echo "Focused browser diagnostics only; no deployment."
            npx playwright test --grep "$(cat tests/ci-browser-grep.txt)" --repeat-each=3
          else
            npx playwright test
          fi
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Build verified staging
        if: github.ref_name != 'verify-commercial'
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Apply staging migrations
        if: github.ref_name != 'verify-commercial'
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env staging
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 179e35741ac5e7a9e2c3be26f5a482b8
      - name: Deploy verified staging
        if: github.ref_name != 'verify-commercial'
        run: npx wrangler deploy --var BUILD_REVISION:${GITHUB_SHA}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 179e35741ac5e7a9e2c3be26f5a482b8
      - name: Import reviewed founder context into staging
        if: github.ref_name != 'verify-commercial'
        run: node scripts/seed-reviewed-context.mjs staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OMNI101_PRIVATE_MANDATES_GZIP_1: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_1 }}
          OMNI101_PRIVATE_MANDATES_GZIP_2: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_2 }}
      - name: Verify live visitor to AI to approval chain
        if: github.ref_name != 'verify-commercial'
        run: node tests/cloud-smoke.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: omni101-verified-build
          path: apps/web/build
          retention-days: 7
          if-no-files-found: ignore
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: omni101-verification-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
        if: always()

  production:
    if: github.ref_name == 'release-commercial'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          CLOUDFLARE_ENV: production
      - name: Preflight required private founder originals
        run: node scripts/seed-reviewed-context.mjs --preflight
        env:
          OMNI101_PRIVATE_MANDATES_GZIP_1: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_1 }}
          OMNI101_PRIVATE_MANDATES_GZIP_2: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_2 }}
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 179e35741ac5e7a9e2c3be26f5a482b8
      - name: Publish omni101.app
        run: npx wrangler deploy --var BUILD_REVISION:${GITHUB_SHA}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 179e35741ac5e7a9e2c3be26f5a482b8
      - name: Import reviewed founder context into production
        run: node scripts/seed-reviewed-context.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OMNI101_PRIVATE_MANDATES_GZIP_1: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_1 }}
          OMNI101_PRIVATE_MANDATES_GZIP_2: ${{ secrets.OMNI101_PRIVATE_MANDATES_GZIP_2 }}
      - name: Verify public cutover
        run: |
          curl --retry 4 --retry-delay 3 --fail --silent https://omni101.app/api/health | python3 -c 'import sys,json,os; d=json.load(sys.stdin); assert d["application"]=="omni101-app" and d["database"] and d["revision"]==os.environ["GITHUB_SHA"]'
          curl --fail --silent https://omni101.app/ | python3 -c 'import sys; assert "La tua idea." in sys.stdin.read()'
